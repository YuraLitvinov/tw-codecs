# Build every package in ci/packages.txt as its own job, then publish one zypper repo.
#
# A matrix cannot express "job A waits for job B", so build_all.py --matrix splits the
# packages into two stages: stage1 has no dependency on another listed package (after
# dropping dependencies the openSUSE and VideoLAN repos already satisfy); stage2 packages
# need a stage1 package and get its RPMs through --deps.
#
# Publishing uses the Pages "GitHub Actions" source (Settings > Pages), unlike build.yml,
# which pushes the gh-pages branch.
#
# The schedule checks every 15 minutes (GitHub may start a scheduled run late or skip it under
# load, so this is approximate). A run that finds nothing new costs seconds. Concurrency keeps at
# most one run waiting, and it sees the snapshot recorded by the run before it and stops.
#
# Scheduled runs only build when openSUSE has published a new Tumbleweed snapshot: the
# `snapshot` job compares the current id with snapshot.txt, and the `record` job commits the
# new id after a successful publish. A manual run builds regardless unless `force` is off.
# (GitHub disables scheduled workflows in a repository with no activity for 60 days.)
#
# A new snapshot rarely changes our packages, so `plan` also compares each package's source RPM
# and build configuration with built-sources.txt and rebuilds only what changed, plus whatever
# depends on it. The RPMs of the other packages are carried over from the published site, so
# every run still publishes the complete repository. The weekly run, and a manual run with
# `full`, rebuild everything, which catches ABI changes in VideoLAN or openSUSE devel packages.
name: build-matrix

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the openSUSE snapshot is unchanged"
        type: boolean
        default: true
      full:
        description: "Rebuild every package, not only the changed ones"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Never cancel a half-published repo; a second run queues.
  group: build-matrix
  cancel-in-progress: false

env:
  CONTAINER_ENGINE: docker
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  # Authenticates the release lookup that provides the SRPMs openSUSE does not ship.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      full: ${{ steps.check.outputs.full }}
      snapshot: ${{ steps.check.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare the openSUSE snapshot with snapshot.txt
        id: check
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || github.event.schedule == '0 3 * * 1' }}
        run: |
          python3 ci/snapshot.py check snapshot.txt | tee check.txt
          cat check.txt >> "$GITHUB_OUTPUT"
          # The weekly run and a "full" manual run build whatever the snapshot says.
          if [ "$FORCE" = "true" ] || [ "$FULL" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=$(sed -n 's/^changed=//p' check.txt)" >> "$GITHUB_OUTPUT"
          fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"

  plan:
    needs: snapshot
    if: ${{ needs.snapshot.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      stage1: ${{ steps.matrix.outputs.stage1 }}
      stage2: ${{ steps.matrix.outputs.stage2 }}
      dirty: ${{ steps.matrix.outputs.dirty }}
      carry: ${{ steps.matrix.outputs.carry }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the builder image
        run: docker build -t srpm-builder .

      - name: Plan what to rebuild
        id: matrix
        env:
          FULL: ${{ needs.snapshot.outputs.full }}
        run: |
          all=""; [ "$FULL" = "true" ] && all="--all"
          python3 build_all.py --matrix $all --write-state new-built-sources.txt | tee matrix.json
          for key in stage1 stage2 dirty carry; do
            echo "$key=$(jq -c ".$key" matrix.json)" >> "$GITHUB_OUTPUT"
          done

      - name: Keep the new state for the record job
        uses: actions/upload-artifact@v4
        with:
          name: built-sources
          path: new-built-sources.txt

  stage1:
    needs: plan
    # An empty matrix is an error, so skip the job when no package without a rebuilt dependency changed.
    if: ${{ needs.plan.outputs.stage1 != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stage1) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Build ${{ matrix.name }}
        run: |
          mkdir -p deps
          # RPMs of dependencies that are not rebuilt in this run come from the published site.
          python3 build_all.py --only "${{ matrix.name }}" --deps deps \
            --carry-over "$SITE_URL" --carry "${{ matrix.carry }}"

      - uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.name }}
          path: out-all/*.rpm
          if-no-files-found: error

  stage2:
    needs: [plan, stage1]
    # stage1 is skipped when empty; an empty stage2 matrix is an error, so skip it too.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.stage2 != '[]' && (needs.stage1.result == 'success' || needs.stage1.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stage2) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Download the stage1 RPMs
        uses: actions/download-artifact@v4
        with:
          pattern: rpms-*
          path: deps
          merge-multiple: true

      - name: Build ${{ matrix.name }}
        run: |
          mkdir -p deps
          python3 build_all.py --only "${{ matrix.name }}" --deps deps \
            --carry-over "$SITE_URL" --carry "${{ matrix.carry }}"

      - uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.name }}
          path: out-all/*.rpm
          if-no-files-found: error

  publish:
    needs: [plan, stage1, stage2]
    # Nothing to publish when no package changed. A stage is skipped when empty; a failed or
    # cancelled build stops publishing.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.dirty != '[]' && (needs.stage1.result == 'success' || needs.stage1.result == 'skipped') && (needs.stage2.result == 'success' || needs.stage2.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PAGES_OWNER: ${{ github.repository_owner }}
      PAGES_REPO: ${{ github.event.repository.name }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Install createrepo_c
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y createrepo-c

      - name: Download the RPMs that were rebuilt
        uses: actions/download-artifact@v4
        with:
          pattern: rpms-*
          path: out-all
          merge-multiple: true

      - name: Stage the repo (signed when GPG_PRIVATE_KEY is set)
        env:
          # The packages that were not rebuilt keep the RPMs they already have on the site.
          CARRY: ${{ join(fromJSON(needs.plan.outputs.carry), ' ') }}
        run: |
          mkdir -p out-all
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            keyfile="$RUNNER_TEMP/signing-key.asc"
            (umask 077; printf '%s\n' "$GPG_PRIVATE_KEY" > "$keyfile")
            export GPG_PRIVATE_KEY_FILE="$keyfile"
          fi
          python3 build_all.py --stage-only --carry-over "$SITE_URL" --carry "$CARRY"
          rm -f "$RUNNER_TEMP/signing-key.asc"
          ls -la site/repo | head -50

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  record:
    needs: [snapshot, plan, publish]
    # After a successful publish, or when nothing changed so there was nothing to publish.
    # A failed build is not recorded, so the next scheduled run tries again.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.plan.outputs.dirty == '[]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the state this run was planned from
        uses: actions/download-artifact@v4
        with:
          name: built-sources

      - name: Commit the snapshot id and the built sources
        env:
          SNAPSHOT: ${{ needs.snapshot.outputs.snapshot }}
        run: |
          python3 ci/snapshot.py write snapshot.txt "$SNAPSHOT"
          cp new-built-sources.txt built-sources.txt
          # `git diff` ignores untracked files, so use status: the first run creates both files.
          if [ -z "$(git status --porcelain -- snapshot.txt built-sources.txt)" ]; then
            echo "snapshot.txt and built-sources.txt are already up to date ($SNAPSHOT)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.txt built-sources.txt
          git commit -m "Record openSUSE snapshot $SNAPSHOT"
          git push
